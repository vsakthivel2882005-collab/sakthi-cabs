
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>SAKTHI CABS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#map{position:fixed;inset:0;width:100%;height:100%;z-index:1}

.topbar{
 position:fixed;top:12px;left:12px;right:12px;z-index:500;
 display:flex;justify-content:space-between;align-items:center;
 background:#111e;padding:13px 16px;border:1px solid #333;
 border-radius:15px;backdrop-filter:blur(10px)
}
.logo{font-size:20px;font-weight:900;color:#f5bd36}
.logo span{color:white}
.top-actions{display:flex;gap:8px}
.smallbtn{border:1px solid #444;background:#222;color:white;padding:9px 12px;border-radius:9px}

.panel{
 position:fixed;z-index:500;bottom:0;left:0;right:0;
 max-height:77vh;overflow-y:auto;background:#101010;
 border-radius:24px 24px 0 0;padding:18px 16px 30px;
 border-top:1px solid #333;box-shadow:0 -10px 35px #0008
}
.handle{width:45px;height:5px;background:#555;border-radius:10px;margin:0 auto 16px}
h2{font-size:20px;margin:5px 0 15px}
h3{font-size:15px;margin:18px 0 10px}
.field{margin-bottom:12px}
label{display:block;color:#aaa;font-size:12px;margin-bottom:6px}
input,select{
 width:100%;padding:13px;background:#1b1b1b;color:white;
 border:1px solid #393939;border-radius:10px;outline:none
}
input:focus,select:focus{border-color:#f5bd36}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{
 width:100%;padding:15px;background:#f5bd36;color:#111;
 border:0;border-radius:12px;font-weight:900;margin-top:8px
}
.primary:disabled{opacity:.5}
.secondary{
 width:100%;padding:13px;background:#252525;color:white;
 border:1px solid #444;border-radius:10px;margin-top:8px
}
.vehicle-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.vehicle{
 background:#1b1b1b;border:1px solid #383838;
 padding:12px;border-radius:12px;cursor:pointer
}
.vehicle.active{border:2px solid #f5bd36;background:#302714}
.vehicle strong{display:block;margin-bottom:5px}
.vehicle small{color:#aaa}
.info{background:#1b1b1b;padding:12px;border-radius:10px;margin:10px 0;color:#ddd;font-size:13px}
.fare{font-size:25px;font-weight:900;color:#f5bd36}
.card{background:#1b1b1b;padding:13px;border:1px solid #333;border-radius:12px;margin:9px 0}
.card button{margin-top:9px}
.status{color:#f5bd36;font-weight:bold}
#authSection{
 position:fixed;inset:0;z-index:2000;background:#080808;
 display:flex;align-items:center;justify-content:center;padding:20px
}
.authbox{
 width:100%;max-width:400px;background:#151515;
 border:1px solid #333;border-radius:20px;padding:24px
}
.authbox h1{color:#f5bd36;text-align:center}
.authbox p{text-align:center;color:#aaa;font-size:13px}
.authbox input{margin:7px 0}
#message{font-size:13px;color:#f5bd36;margin:10px 0;white-space:pre-wrap}
.error{color:#ff7777!important}
.success{color:#7de3a0!important}
#historySection{margin-top:15px}
.leaflet-control-attribution{font-size:9px}

@media(min-width:750px){
 .panel{left:auto;width:420px;max-height:85vh;bottom:20px;right:20px;border-radius:20px}
 .topbar{right:460px}
}
</style>
</head>

<body>

<div id="map"></div>

<div class="topbar">
 <div class="logo">SAKTHI <span>CABS</span></div>
 <div class="top-actions">
  <button class="smallbtn" onclick="showHistory()">My Rides</button>
  <button class="smallbtn" onclick="logout()">Logout</button>
 </div>
</div>

<!-- LOGIN -->
<div id="authSection">
 <div class="authbox">
  <h1>SAKTHI CABS</h1>
  <p>Your ride. Your choice.</p>

  <div id="registerFields" class="hidden">
   <input id="regName" placeholder="Full Name">
   <input id="regPhone" placeholder="Mobile Number" type="tel">
  </div>

  <input id="email" type="email" placeholder="Email Address" autocomplete="email">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">

  <button class="primary" id="authButton" onclick="login()">LOGIN</button>
  <button class="secondary" onclick="toggleRegister()" id="toggleButton">Create New Account</button>
  <div id="message"></div>
 </div>
</div>

<!-- CUSTOMER APP -->
<div class="panel hidden" id="appSection">
 <div class="handle"></div>
 <h2>Book Your Ride</h2>

 <div class="field">
  <label>TRIP TYPE</label>
  <select id="tripType" onchange="resetRoute()">
   <option value="local">Local Ride</option>
   <option value="outstation">Outstation Ride</option>
  </select>
 </div>

 <div class="field">
  <label>PICKUP LOCATION</label>
  <input id="pickupAddress" placeholder="Pickup address">
 </div>

 <div class="grid2">
  <div class="field">
   <label>Pickup District</label>
   <select id="pickupDistrict"></select>
  </div>
  <div class="field">
   <label>Pickup City</label>
   <input id="pickupCity" placeholder="Pickup city">
  </div>
 </div>

 <button class="secondary" onclick="getGPS()">📍 Use Current GPS Location</button>

 <div class="field" style="margin-top:13px">
  <label>DROP LOCATION</label>
  <input id="dropAddress" placeholder="Enter destination address">
 </div>

 <div class="grid2">
  <div class="field">
   <label>Drop District</label>
   <select id="dropDistrict"></select>
  </div>
  <div class="field">
   <label>Drop City</label>
   <input id="dropCity" placeholder="Destination city">
  </div>
 </div>

 <button class="secondary" onclick="calculateRoute()">🗺️ Calculate Route & Distance</button>

 <div class="info" id="routeInfo">
  Select pickup and drop locations to calculate distance.
 </div>

 <h3>Select Vehicle</h3>
 <div class="vehicle-grid" id="vehicleList">Loading vehicles...</div>

 <h3>Payment Method</h3>
 <select id="paymentMethod">
  <option value="cash">Cash</option>
  <option value="upi">UPI</option>
  <option value="online">Online</option>
 </select>

 <div class="info">
  Estimated Fare
  <div class="fare" id="fare">₹0</div>
  <small id="fareDetails">Calculate route and select vehicle.</small>
 </div>

 <button class="primary" onclick="bookCab()" id="bookButton">BOOK YOUR RIDE</button>
 <button class="secondary" onclick="findDrivers()">Find Available Drivers</button>

 <div id="driverSection"></div>
 <div id="historySection"></div>
</div>

<script>
// ==========================================
// 1. SUPABASE CONFIGURATION
// ==========================================

const SUPABASE_URL = "https://kzcczciqaxawbesgtgcf.supabase.co";

const SUPABASE_KEY = "sb_publishable_bKS7yIQ01_cOi972JQ7jQw_WjxhbKKb";

const supabaseClient = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

// ==========================================
// 2. GLOBAL VARIABLES
// ==========================================

let currentUser = null;
let isRegister = false;
let appStarted = false;

let map = null;
let pickupMarker = null;
let dropMarker = null;
let routeLayer = null;

let pickupLat = null;
let pickupLng = null;
let dropLat = null;
let dropLng = null;

let routeDistance = 0;
let selectedVehicle = null;
let vehicles = [];
let currentBookingId = null;
let realtimeChannel = null;

// ==========================================
// 3. TAMIL NADU DISTRICTS
// ==========================================

const districts = [
"Chennai","Chengalpattu","Kancheepuram","Tiruvallur",
"Vellore","Ranipet","Tirupattur","Tiruvannamalai",
"Villupuram","Kallakurichi","Cuddalore","Mayiladuthurai",
"Nagapattinam","Tiruvarur","Thanjavur","Pudukkottai",
"Trichy","Perambalur","Ariyalur","Karur","Namakkal",
"Salem","Dharmapuri","Krishnagiri","Erode","Coimbatore",
"Tiruppur","The Nilgiris","Dindigul","Theni","Madurai",
"Sivaganga","Ramanathapuram","Virudhunagar","Tenkasi",
"Tirunelveli","Thoothukudi","Kanniyakumari"
];

function loadDistricts(){
 const options =
  '<option value="">Select District</option>' +
  districts.map(d=>`<option value="${d}">${d}</option>`).join("");

 document.getElementById("pickupDistrict").innerHTML=options;
 document.getElementById("dropDistrict").innerHTML=options;
}

// ==========================================
// 4. AUTHENTICATION
// ==========================================

function showMessage(message,type=""){
 const el=document.getElementById("message");
 el.innerText=message;
 el.className=type;
}

function toggleRegister(){
 isRegister=!isRegister;

 document.getElementById("registerFields")
  .classList.toggle("hidden",!isRegister);

 document.getElementById("authButton").innerText=
  isRegister?"REGISTER":"LOGIN";

 document.getElementById("toggleButton").innerText=
  isRegister?"Already have an account? Login":"Create New Account";

 showMessage("");
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const button=document.getElementById("authButton");

 if(!email||!password){
  showMessage("Enter email and password.","error");
  return;
 }

 button.disabled=true;
 button.innerText="PLEASE WAIT...";
 showMessage("Connecting to Supabase...");

 try{
  if(isRegister){
   const name=document.getElementById("regName").value.trim();
   const phone=document.getElementById("regPhone").value.trim();

   if(!name||!phone){
    throw new Error("Enter your name and mobile number.");
   }

   const {data,error}=await supabaseClient.auth.signUp({
    email:email,
    password:password,
    options:{
     data:{
      full_name:name,
      phone:phone
     }
    }
   });

   if(error)throw error;

   if(!data.session){
    showMessage(
     "Account created. Please verify your email, then login.",
     "success"
    );
    alert("Registration successful. Check your email for verification.");
   }else{
    currentUser=data.user;
    await saveProfile(name,phone);
    await startApp(data.user);
   }

  }else{
   const {data,error}=await supabaseClient.auth.signInWithPassword({
    email:email,
    password:password
   });

   if(error)throw error;

   currentUser=data.user;
   await startApp(data.user);
  }

 }catch(error){
  console.error("LOGIN ERROR:",error);
  showMessage("ERROR: "+error.message,"error");
  alert("SAKTHI CABS: "+error.message);

 }finally{
  button.disabled=false;
  button.innerText=isRegister?"REGISTER":"LOGIN";
 }
}

// ==========================================
// 5. PROFILE SAVE
// ==========================================

async function saveProfile(name,phone){
 if(!currentUser)return;

 // Do not change or assign the user's role here.
 const {error}=await supabaseClient
  .from("profiles")
  .upsert({
   id:currentUser.id,
   full_name:name,
   phone:phone
  },{onConflict:"id"});

 if(error){
  console.error("Profile save error:",error.message);
 }
}

// ==========================================
// 6. START APP - SINGLE ENTRY
// ==========================================

async function startApp(user){
 if(!user)return;

 if(appStarted && currentUser?.id===user.id)return;

 currentUser=user;
 appStarted=true;

 document.getElementById("authSection").classList.add("hidden");
 document.getElementById("appSection").classList.remove("hidden");

 initMap();

 await loadVehicles();
 await loadHistory();
 enableRealtime();

 setTimeout(()=>{
  if(map)map.invalidateSize();
 },500);
}

async function logout(){
 if(realtimeChannel){
  await supabaseClient.removeChannel(realtimeChannel);
  realtimeChannel=null;
 }

 await supabaseClient.auth.signOut();
 location.reload();
}

// ==========================================
// 7. SESSION CHECK
// ==========================================

async function checkSession(){
 loadDistricts();

 try{
  const {data,error}=await supabaseClient.auth.getSession();

  if(error)throw error;

  if(data.session){
   currentUser=data.session.user;
   await startApp(data.session.user);
  }

 }catch(error){
  console.error(error);
  showMessage("Session error: "+error.message,"error");
 }
}

// ==========================================
// 8. MAP INITIALIZATION
// ==========================================

function initMap(){
 if(map)return;

 map=L.map("map").setView([11.1271,78.6569],7);

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   maxZoom:19,
   attribution:"© OpenStreetMap contributors"
  }
 ).addTo(map);

 setTimeout(()=>map.invalidateSize(),300);
}

function updateMarker(type,lat,lng){
 const point=[lat,lng];

 if(type==="pickup"){
  if(pickupMarker)map.removeLayer(pickupMarker);

  pickupMarker=L.marker(point)
   .addTo(map)
   .bindPopup("Pickup Location");
 }else{
  if(dropMarker)map.removeLayer(dropMarker);

  dropMarker=L.marker(point)
   .addTo(map)
   .bindPopup("Drop Location");
 }

 if(pickupMarker&&dropMarker){
  const group=L.featureGroup([pickupMarker,dropMarker]);
  map.fitBounds(group.getBounds().pad(0.2));
 }else{
  map.setView(point,15);
 }
}

// ==========================================
// 9. GPS LOCATION
// ==========================================

async function getGPS(){
 if(!navigator.geolocation){
  alert("GPS is not supported by this browser.");
  return;
 }

 navigator.geolocation.getCurrentPosition(
  async position=>{
   pickupLat=position.coords.latitude;
   pickupLng=position.coords.longitude;

   updateMarker("pickup",pickupLat,pickupLng);

   document.getElementById("routeInfo").innerText=
    "Pickup GPS location captured.";

   try{
    const url=
     `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${pickupLat}&lon=${pickupLng}`;

    const response=await fetch(url);

    if(!response.ok)throw new Error("Address lookup failed");

    const result=await response.json();

    document.getElementById("pickupAddress").value=
     result.display_name||"Current GPS Location";

   }catch(error){
    document.getElementById("pickupAddress").value=
     "Current GPS Location";
   }

   resetRoute();
  },

  error=>{
   alert("GPS unavailable. Allow location permission and try again.");
  },

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:0
  }
 );
}

// ==========================================
// 10. ADDRESS SEARCH
// ==========================================

async function geocodeAddress(address,district,city){
 const query=[
  address,
  city,
  district,
  "Tamil Nadu",
  "India"
 ].filter(Boolean).join(", ");

 const url=
  "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q="+
  encodeURIComponent(query);

 const response=await fetch(url);

 if(!response.ok){
  throw new Error("Address search service unavailable.");
 }

 const results=await response.json();

 if(!results.length){
  throw new Error("Location not found: "+query);
 }

 return {
  lat:Number(results[0].lat),
  lng:Number(results[0].lon),
  name:results[0].display_name
 };
}

// ==========================================
// 11. ROUTE CALCULATION
// ==========================================

async function calculateRoute(){
 try{
  const pickupAddress=
   document.getElementById("pickupAddress").value.trim();

  const dropAddress=
   document.getElementById("dropAddress").value.trim();

  const pickupDistrict=
   document.getElementById("pickupDistrict").value;

  const dropDistrict=
   document.getElementById("dropDistrict").value;

  const pickupCity=
   document.getElementById("pickupCity").value.trim();

  const dropCity=
   document.getElementById("dropCity").value.trim();

  if(!pickupAddress||!dropAddress){
   throw new Error("Enter pickup and drop addresses.");
  }

  document.getElementById("routeInfo").innerText=
   "Finding locations and calculating road route...";

  if(pickupLat===null||pickupLng===null){
   const p=await geocodeAddress(
    pickupAddress,pickupDistrict,pickupCity
   );

   pickupLat=p.lat;
   pickupLng=p.lng;
  }

  const d=await geocodeAddress(
   dropAddress,dropDistrict,dropCity
  );

  dropLat=d.lat;
  dropLng=d.lng;

  updateMarker("pickup",pickupLat,pickupLng);
  updateMarker("drop",dropLat,dropLng);

  const routeURL=
   `https://router.project-osrm.org/route/v1/driving/${pickupLng},${pickupLat};${dropLng},${dropLat}?overview=full&geometries=geojson`;

  const routeResponse=await fetch(routeURL);

  if(!routeResponse.ok){
   throw new Error("Route service unavailable.");
  }

  const routeData=await routeResponse.json();

  if(routeData.code!=="Ok"||!routeData.routes.length){
   throw new Error("Road route not available.");
  }

  const route=routeData.routes[0];

  routeDistance=route.distance/1000;

  if(routeLayer)map.removeLayer(routeLayer);

  routeLayer=L.geoJSON(route.geometry,{
   style:{
    color:"#e6a900",
    weight:5,
    opacity:0.9
   }
  }).addTo(map);

  map.fitBounds(routeLayer.getBounds().pad(0.15));

  document.getElementById("routeInfo").innerHTML=
   `<b>Road Distance:</b> ${routeDistance.toFixed(2)} KM<br>
   <b>Estimated Travel Time:</b> ${Math.round(route.duration/60)} minutes`;

  updateFare();

 }catch(error){
  console.error("ROUTE ERROR:",error);

  routeDistance=0;
  updateFare();

  document.getElementById("routeInfo").innerText=
   error.message;
 }
}

function resetRoute(){
 routeDistance=0;
 dropLat=null;
 dropLng=null;

 if(routeLayer&&map){
  map.removeLayer(routeLayer);
  routeLayer=null;
 }

 if(dropMarker&&map){
  map.removeLayer(dropMarker);
  dropMarker=null;
 }

 document.getElementById("routeInfo").innerText=
  "Calculate route again after changing locations.";

 updateFare();
}

// ==========================================
// 12. VEHICLES
// ==========================================

async function loadVehicles(){
 const list=document.getElementById("vehicleList");

 list.innerText="Loading vehicles...";

 const {data,error}=await supabaseClient
  .from("vehicles")
  .select("id,name,base_fare,per_km,is_active")
  .eq("is_active",true)
  .order("base_fare");

 if(error){
  list.innerText="Vehicle loading failed: "+error.message;
  console.error(error);
  return;
 }

 vehicles=data||[];

 if(!vehicles.length){
  list.innerText="No active vehicles found in database.";
  return;
 }

 list.innerHTML=vehicles.map(v=>`
  <div class="vehicle" id="vehicle-${v.id}"
   onclick="selectVehicle('${v.id}')">
   <strong>${escapeHTML(v.name)}</strong>
   <small>Base Fare: ₹${Number(v.base_fare).toFixed(0)}</small><br>
   <small>Per KM: ₹${Number(v.per_km).toFixed(0)}</small>
  </div>
 `).join("");

 selectVehicle(vehicles[0].id);
}

function selectVehicle(id){
 selectedVehicle=vehicles.find(v=>v.id===id);

 document.querySelectorAll(".vehicle").forEach(el=>{
  el.classList.remove("active");
 });

 const element=document.getElementById("vehicle-"+id);

 if(element)element.classList.add("active");

 updateFare();
}

// ==========================================
// 13. FARE CALCULATION
// ==========================================

function updateFare(){
 const fareElement=document.getElementById("fare");
 const detail=document.getElementById("fareDetails");

 if(!selectedVehicle||routeDistance<=0){
  fareElement.innerText="₹0";
  detail.innerText="Calculate route and select vehicle.";
  return;
 }

 const base=Number(selectedVehicle.base_fare);
 const perKm=Number(selectedVehicle.per_km);
 const total=base+(routeDistance*perKm);

 fareElement.innerText="₹"+Math.ceil(total);

 detail.innerText=
  `Base ₹${base} + ${routeDistance.toFixed(2)} KM × ₹${perKm}/KM`;
}

// ==========================================
// 14. CREATE BOOKING
// ==========================================

async function bookCab(){
 if(!currentUser){
  alert("Please login first.");
  return;
 }

 if(!selectedVehicle){
  alert("Select a vehicle.");
  return;
 }

 if(routeDistance<=0||pickupLat===null||dropLat===null){
  alert("Calculate the route before booking.");
  return;
 }

 const pickupAddress=
  document.getElementById("pickupAddress").value.trim();

 const dropAddress=
