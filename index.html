
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>SAKTHI CABS | Book Your Ride</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080808;color:white;
 font-family:Arial,sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#map{

 z-index:1;
}
.topbar{

 z-index:500;display:flex;justify-content:space-between;

 padding:13px 16px;border:1px solid #333;
 border-radius:15px;backdrop-filter:blur(10px);
}
.logo{font-size:20px;font-weight:900;color:#f5bd36}
.logo span{color:white}
.top-actions{display:flex;gap:8px}
.smallbtn{

}
.panel{

 max-height:77vh;overflow-y:auto;
 background:#101010;border-radius:24px 24px 0 0;
 padding:18px 16px 30px;

 box-shadow:0 -10px 35px #0008;
}
.handle{
 width:45px;height:5px;background:#555;
 border-radius:10px;margin:0 auto 16px;
}
h2{font-size:20px;margin:5px 0 15px}
h3{font-size:15px;margin:18px 0 10px}
.field{margin-bottom:12px}
label{

 margin-bottom:6px;
}
input,select{

 color:white;border:1px solid #393939;
 border-radius:10px;outline:none;
}
input:focus,select:focus{border-color:#f5bd36}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{

 color:#111;border:0;border-radius:12px;

}
.secondary{

 color:white;border:1px solid #444;
 border-radius:10px;margin-top:8px;
}
.vehicle-grid{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:9px;
}
.vehicle{
 background:#1b1b1b;border:1px solid #383838;
 padding:12px;border-radius:12px;
 cursor:pointer;
}
.vehicle.active{
 border:2px solid #f5bd36;
 background:#302714;
}
.vehicle strong{display:block;margin-bottom:5px}
.vehicle small{color:#aaa}
.info{
 background:#1b1b1b;padding:12px;

 color:#ddd;font-size:13px;
}
.fare{
 font-size:25px;font-weight:900;color:#f5bd36;
}
.card{

 border:1px solid #333;border-radius:12px;

}
.card button{margin-top:9px}
.status{color:#f5bd36;font-weight:bold}
#authSection{
 position:fixed;inset:0;z-index:2000;
 background:#080808;display:flex;
 align-items:center;justify-content:center;
 padding:20px;
}
.authbox{
 width:100%;max-width:400px;
 background:#151515;border:1px solid #333;
 border-radius:20px;padding:24px;
}
.authbox h1{color:#f5bd36;text-align:center}
.authbox p{text-align:center;color:#aaa;font-size:13px}
.authbox input{margin:7px 0}
#message{
 font-size:13px;color:#f5bd36;
 margin:10px 0;white-space:pre-wrap;
}
#historySection{margin-top:15px}
.leaflet-control-attribution{font-size:9px}
@media(min-width:750px){
 .panel{left:auto;width:420px;max-height:85vh;bottom:20px;right:20px;border-radius:20px}
 .topbar{right:460px}
}
</style>
</head>

<body>

<div id="authSection">

  Find Available Drivers

<script>
// ----------------------------------
// SUPABASE CONFIGURATION
// ----------------------------------

const SUPABASE_URL =
 "https://kzcczciqaxawbesgtgcf.supabase.co";

const SUPABASE_KEY =
 "sb_publishable_bKS7yIQ01_cOi972JQ7jQw_WjxhbKKb";

const supabaseClient = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

// ----------------------------------
// GLOBAL VARIABLES
// ----------------------------------

let currentUser = null;
let isRegister = false;
let map = null;
let pickupMarker = null;
let dropMarker = null;
let routeLayer = null;

let pickupLat = null;
let pickupLng = null;
let dropLat = null;
let dropLng = null;

let routeDistance = 0;
let selectedVehicle = null;
let vehicles = [];

let currentBookingId = null;

const districts = [
"அரியலூர்","செங்கல்பட்டு","சென்னை","கோயம்புத்தூர்",
"கடலூர்","தர்மபுரி","திண்டுக்கல்","ஈரோடு",
"கள்ளக்குறிச்சி","காஞ்சிபுரம்","கன்னியாகுமரி",
"கரூர்","கிருஷ்ணகிரி","மதுரை","மயிலாடுதுறை",
"நாகப்பட்டினம்","நாமக்கல்","நீலகிரி",
"பெரம்பலூர்","புதுக்கோட்டை","ராமநாதபுரம்",
"ராணிப்பேட்டை","சேலம்","சிவகங்கை",
"தென்காசி","தஞ்சாவூர்","தேனி",
"திருவள்ளூர்","திருவாரூர்","தூத்துக்குடி",
"திருச்சிராப்பள்ளி","திருநெல்வேலி",
"திருப்பத்தூர்","திருப்பூர்","திருவண்ணாமலை",
"வேலூர்","விழுப்புரம்","விருதுநகர்"
];

// ----------------------------------
// DISTRICT DROPDOWNS
// ----------------------------------

function loadDistricts(){
 const options =
  '<option value="">Select District</option>' +
  districts.map(d=>`<option value="${d}">${d}</option>`).join("");

 document.getElementById("pickupDistrict").innerHTML=options;
 document.getElementById("dropDistrict").innerHTML=options;
}

// ----------------------------------
// AUTHENTICATION
// ----------------------------------

function toggleRegister(){
 isRegister=!isRegister;

 document.getElementById("registerFields")
  .classList.toggle("hidden",!isRegister);

 document.getElementById("authButton").innerText=
  isRegister?"REGISTER":"LOGIN";

 document.getElementById("toggleButton").innerText=
  isRegister?"Already have an account? Login":"Create New Account";

 document.getElementById("message").innerText="";
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 const msg=document.getElementById("message");

 if(!email||!password){
  msg.innerText="Enter email and password.";
  return;
 }

 msg.innerText="Please wait...";

 if(isRegister){
  const name=document.getElementById("regName").value.trim();
  const phone=document.getElementById("regPhone").value.trim();

  if(!name||!phone){
   msg.innerText="Enter your name and mobile number.";
   return;
  }

  const {data,error}=await supabaseClient.auth.signUp({
   email,
   password,
   options:{
    data:{
     full_name:name,
     phone:phone
    }
   }
  });

  if(error){
   msg.innerText=error.message;
   return;
  }

  if(data.session){
   await saveProfile(name,phone);
   msg.innerText="Registration successful.";
   await startApp(data.session.user);
  }else{
   msg.innerText=
    "Account created. Verify your email, then login.";
  }

 }else{
  const {data,error}=await supabaseClient.auth.signInWithPassword({
   email,password
  });

  if(error){
   msg.innerText=error.message;
   return;
  }

  await startApp(data.user);
 }
}

async function saveProfile(name,phone){
 if(!currentUser)return;

 // Role is deliberately not accepted from the browser.
 const {error}=await supabaseClient
  .from("profiles")
  .upsert({
   id:currentUser.id,
   full_name:name,
   phone:phone
  },{onConflict:"id"});

 if(error)console.error("Profile update:",error.message);
}

async function startApp(user){
 currentUser=user;

 document.getElementById("authSection").classList.add("hidden");
 document.getElementById("appSection").classList.remove("hidden");

 const metadata=user.user_metadata||{};

 if(metadata.full_name||metadata.phone){
  await saveProfile(
   metadata.full_name||"",
   metadata.phone||""
  );
 }

 initMap();
 await loadVehicles();
 await loadHistory();
}

async function logout(){
 await supabaseClient.auth.signOut();
 location.reload();
}

// ----------------------------------
// SESSION CHECK
// ----------------------------------

async function checkSession(){
 loadDistricts();

 const {data,error}=await supabaseClient.auth.getSession();

 if(error){
  document.getElementById("message").innerText=error.message;
  return;
 }

 if(data.session){
  await startApp(data.session.user);
 }
}

checkSession();

// ----------------------------------
// MAP
// ----------------------------------

function initMap(){
 if(map)return;

 map=L.map("map").setView([11.1271,78.6569],7);

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   maxZoom:19,
   attribution:"© OpenStreetMap contributors"
  }
 ).addTo(map);

 setTimeout(()=>map.invalidateSize(),300);
}

function updateMarker(type,lat,lng){
 const point=[lat,lng];

 if(type==="pickup"){
  if(pickupMarker)map.removeLayer(pickupMarker);

  pickupMarker=L.marker(point)
   .addTo(map)
   .bindPopup("Pickup Location");
 }else{
  if(dropMarker)map.removeLayer(dropMarker);

  dropMarker=L.marker(point)
   .addTo(map)
   .bindPopup("Drop Location");
 }

 if(pickupMarker&&dropMarker){
  const group=L.featureGroup([pickupMarker,dropMarker]);
  map.fitBounds(group.getBounds().pad(0.2));
 }else{
  map.setView(point,15);
 }
}

// ----------------------------------
// GPS LOCATION
// ----------------------------------

async function getGPS(){
 if(!navigator.geolocation){
  alert("GPS is not supported.");
  return;
 }

 navigator.geolocation.getCurrentPosition(
  async position=>{
   pickupLat=position.coords.latitude;
   pickupLng=position.coords.longitude;

   updateMarker("pickup",pickupLat,pickupLng);

   document.getElementById("routeInfo").innerText=
    "Pickup GPS location captured.";

   try{
    const url=
     `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${pickupLat}&lon=${pickupLng}`;

    const response=await fetch(url);
    const result=await response.json();

    document.getElementById("pickupAddress").value=
     result.display_name||"Current GPS Location";

   }catch(error){
    document.getElementById("pickupAddress").value=
     "Current GPS Location";
   }

   resetRoute();
  },
  error=>{
   alert("Unable to get GPS. Allow location permission and try again.");
  },
  {enableHighAccuracy:true,timeout:15000}
 );
}

// ----------------------------------
// ADDRESS GEOCODING
// ----------------------------------

async function geocodeAddress(address,district,city){
 const query=[
  address,
  city,
  district,
  "Tamil Nadu",
  "India"
 ].filter(Boolean).join(", ");

 const url=
  "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q="+
  encodeURIComponent(query);

 const response=await fetch(url);
 const results=await response.json();

 if(!results.length){
  throw new Error("Location not found: "+query);
 }

 return {
  lat:Number(results[0].lat),
  lng:Number(results[0].lon),
  name:results[0].display_name
 };
}

// ----------------------------------
// ROUTE & DISTANCE
// ----------------------------------

async function calculateRoute(){
 try{
  const pickupAddress=
   document.getElementById("pickupAddress").value.trim();

  const dropAddress=
   document.getElementById("dropAddress").value.trim();

  const pickupDistrict=
   document.getElementById("pickupDistrict").value;

  const dropDistrict=
   document.getElementById("dropDistrict").value;

  const pickupCity=
   document.getElementById("pickupCity").value.trim();

  const dropCity=
   document.getElementById("dropCity").value.trim();

  if(!pickupAddress||!dropAddress){
   alert("Enter pickup and drop addresses.");
   return;
  }

  document.getElementById("routeInfo").innerText=
   "Finding locations and calculating road route...";

  if(pickupLat===null){
   const p=await geocodeAddress(
    pickupAddress,pickupDistrict,pickupCity
   );

   pickupLat=p.lat;
   pickupLng=p.lng;
  }

  const d=await geocodeAddress(
   dropAddress,dropDistrict,dropCity
  );

  dropLat=d.lat;
  dropLng=d.lng;

  updateMarker("pickup",pickupLat,pickupLng);
  updateMarker("drop",dropLat,dropLng);

  const routeURL=
   `https://router.project-osrm.org/route/v1/driving/${pickupLng},${pickupLat};${dropLng},${dropLat}?overview=full&geometries=geojson`;

  const routeResponse=await fetch(routeURL);
  const routeData=await routeResponse.json();

  if(routeData.code!=="Ok"||!routeData.routes.length){
   throw new Error("Road route not available.");
  }

  const route=routeData.routes[0];

  routeDistance=route.distance/1000;

  if(routeLayer)map.removeLayer(routeLayer);

  routeLayer=L.geoJSON(route.geometry,{
   style:{
    color:"#e6a900",
    weight:5,
    opacity:0.9
   }
  }).addTo(map);

  map.fitBounds(routeLayer.getBounds().pad(0.15));

  document.getElementById("routeInfo").innerHTML=
   `<b>Road Distance:</b> ${routeDistance.toFixed(2)} KM<br>
    <b>Estimated Travel Time:</b> ${Math.round(route.duration/60)} minutes`;

  updateFare();

 }catch(error){
  console.error(error);
  document.getElementById("routeInfo").innerText=
   error.message+" Please check your address and try again.";
 }
}

function resetRoute(){
 routeDistance=0;
 dropLat=null;
 dropLng=null;

 document.getElementById("routeInfo").innerText=
  "Route needs to be calculated again.";

 updateFare();
}

// ----------------------------------
// VEHICLES
// ----------------------------------

async function loadVehicles(){
 const list=document.getElementById("vehicleList");

 const {data,error}=await supabaseClient
  .from("vehicles")
  .select("id,name,base_fare,per_km,is_active")
  .eq("is_active",true)
  .order("base_fare");

 if(error){
  list.innerText="Vehicle loading failed: "+error.message;
  return;
 }

 vehicles=data||[];

 if(!vehicles.length){
  list.innerText="No active vehicles found.";
  return;
 }

 list.innerHTML=vehicles.map(v=>`
  <div class="vehicle" id="vehicle-${v.id}"
   onclick="selectVehicle('${v.id}')">
   <strong>${escapeHTML(v.name)}</strong>
   <small>Base Fare: ₹${Number(v.base_fare).toFixed(0)}</small><br>
   <small>Per KM: ₹${Number(v.per_km).toFixed(0)}</small>
  </div>
 `).join("");

 selectVehicle(vehicles[0].id);
}

function selectVehicle(id){
 selectedVehicle=vehicles.find(v=>v.id===id);

 document.querySelectorAll(".vehicle").forEach(el=>{
  el.classList.remove("active");
 });

 const element=document.getElementById("vehicle-"+id);
 if(element)element.classList.add("active");

 updateFare();
}

function updateFare(){
 const fareElement=document.getElementById("fare");
 const detail=document.getElementById("fareDetails");

 if(!selectedVehicle||routeDistance<=0){
  fareElement.innerText="₹0";
  detail.innerText="Calculate route and select vehicle.";
  return;
 }

 const base=Number(selectedVehicle.base_fare);
 const perKm=Number(selectedVehicle.per_km);
 const total=base+(routeDistance*perKm);

 fareElement.innerText="₹"+Math.ceil(total);

 detail.innerText=
  `Base ₹${base} + ${routeDistance.toFixed(2)} KM × ₹${perKm}/KM`;
}

// ----------------------------------
// BOOKING
// ----------------------------------

async function bookCab(){
 if(!currentUser){
  alert("Please login.");
  return;
 }

 if(!selectedVehicle){
  alert("Select a vehicle.");
  return;
 }

 if(routeDistance<=0||pickupLat===null||dropLat===null){
  alert("Calculate the route before booking.");
  return;
 }

 const pickupAddress=
  document.getElementById("pickupAddress").value.trim();

 const dropAddress=
  document.getElementById("dropAddress").value.trim();

 const pickupDistrict=
  document.getElementById("pickupDistrict").value;

 const dropDistrict=
  document.getElementById("dropDistrict").value;

 const pickupCity=
  document.getElementById("pickupCity").value.trim();

 const dropCity=
  document.getElementById("dropCity").value.trim();

 if(!pickupAddress||!dropAddress||!pickupDistrict||!dropDistrict){
  alert("Complete pickup and drop details.");
  return;
 }

 const tripType=
  document.getElementById("tripType").value;

 if(tripType==="local"&&pickupDistrict!==dropDistrict){
  alert("For local rides, select the same pickup and drop district. Choose Outstation for inter-district rides.");
  return;
 }

 const fare=
  Math.ceil(
   Number(selectedVehicle.base_fare)+
   routeDistance*Number(selectedVehicle.per_km)
  );

 const paymentMethod=
  document.getElementById("paymentMethod").value;

 const button=document.getElementById("bookButton");
 button.disabled=true;
 button.innerText="BOOKING...";

 const booking={
  customer_id:currentUser.id,
  vehicle_id:selectedVehicle.id,
  pickup_address:pickupAddress,
  drop_address:dropAddress,
  pickup_lat:pickupLat,
  pickup_lng:pickupLng,
  drop_lat:dropLat,
  drop_lng:dropLng,
  estimated_fare:fare,
  payment_method:paymentMethod,
  payment_status:"pending",
  status:"pending",
  trip_type:tripType,
  pickup_city:pickupCity||pickupDistrict,
  pickup_district:pickupDistrict,
  drop_city:dropCity||dropDistrict,
  drop_district:dropDistrict
 };

 const {data,error}=await supabaseClient
  .from("bookings")
  .insert(booking)
  .select()
  .single();

 button.disabled=false;
 button.innerText="BOOK YOUR RIDE";

 if(error){
  console.error(error);
  alert("Booking failed: "+error.message);
  return;
 }

 currentBookingId=data.id;

 alert("Booking successful! Booking ID: "+data.id);

 await loadHistory();
 await findDrivers();
}

//
